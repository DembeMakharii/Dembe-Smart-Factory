<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dembe Smart Factory Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/chart.js" rel="stylesheet">
<style>
    * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
</style>
<body>
    <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>

    <div class="dashboard">
        <div class="sidebar" id="sidebar">
            <div class="logo">
                <img src="https://cdn-icons-png.flaticon.com/512/3063/3063187.png" alt="Factory Icon">
                Dembe Smart Factory 
            </div>
            <button class="nav-item active" onclick="switchTab('overview')">
                <span>📊</span> Overview
            </button>
            <button class="nav-item" onclick="switchTab('demand')">
                <span>📈</span> Demand Forecasting
            </button>
            <button class="nav-item" onclick="switchTab('supply')">
                <span>🚚</span> Supply Chain
            </button>
            <button class="nav-item" onclick="switchTab('maintenance')">
                <span>🔧</span> Predictive Maintenance
            </button>
            <button class="nav-item" onclick="switchTab('sustainability')">
                <span>🌱</span> Sustainability
            </button>
            <button class="nav-item" onclick="switchTab('digital-twin')">
                <span>🏭</span> Digital Twin
            </button>
            <button class="nav-item" onclick="switchTab('ai-insights')">
                <span>🤖</span> AI Insights
            </button>
            <button class="nav-item" onclick="switchTab('settings')" style="margin-top: 30px;">
                <span>⚙️</span> Settings
            </button>
        </div>

        <div class="main-content">
            <!-- Overview Tab -->
            <div id="overview" class="tab-content">
                <div class="header">
                    <h1>Manufacturing Analytics Dashboard</h1>
                    <p>Real-time insights for sustainable manufacturing and supply chain optimization</p>
                </div>

                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-value" id="efficiency">94.2%</div>
                        <div class="metric-label">Overall Equipment Effectiveness</div>
                        <span class="trend up">↗ +2.3%</span>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 94.2%"></div>
                        </div>
                          </div>
                    <div class="metric-card">
                        <div class="metric-value" id="cost-savings">$2.4M</div>
                        <div class="metric-label">Cost Optimization Savings</div>
                        <span class="trend up">↗ +15.7%</span>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value" id="carbon-reduction">18.5%</div>
                        <div class="metric-label">Carbon Footprint Reduction</div>
                        <span class="trend up">↗ +3.2%</span>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value" id="inventory-turnover">12.3x</div>
                        <div class="metric-label">Inventory Turnover</div>
                        <span class="trend up">↗ +1.8x</span>
                    </div>
                </div>
</body>
</head>
